[package]
name = "helix-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "helix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
sysinfo = "0.33"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
rand = "0.8"
