[package]
name = "helix-integration-tests"
version = "0.1.0"
edition = "2021"
description = "Comprehensive end-to-end integration tests for HELIX trustless AI training"
autobenches = false

[lib]
name = "helix_integration_tests"
path = "lib.rs"

[dependencies]
# HELIX crates
helix-core = { path = "../crates/helix-core" }
helix-avm = { path = "../crates/helix-avm" }
helix-circuits = { path = "../crates/helix-circuits" }
helix-prover = { path = "../crates/helix-prover" }
helix-mpc = { path = "../crates/helix-mpc" }
helix-node = { path = "../crates/helix-node" }

# Testing utilities
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"

# Halo2 re-exports
halo2_proofs = { git = "https://github.com/privacy-scaling-explorations/halo2", branch = "main" }
halo2curves = "0.7.0"

# Metrics and benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time utilities
chrono = "0.4"

# File system
tempfile = "3.10"

# Thread utilities
parking_lot = "0.12"
dashmap = "6.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Ethereum interaction (on-chain integration tests)
ethers = { version = "2.0", optional = true }
hex = { version = "0.4", optional = true }

[dev-dependencies]
proptest = "1.4"
test-case = "3.3"

[[test]]
name = "end_to_end"
path = "integration/end_to_end.rs"

[[test]]
name = "mpc_zkp_integration"
path = "integration/mpc_zkp_integration.rs"

[[test]]
name = "adversarial"
path = "integration/adversarial.rs"

[[test]]
name = "network_partition"
path = "integration/network_partition.rs"

[[test]]
name = "verification_consistency"
path = "integration/verification_consistency.rs"

[[test]]
name = "training_convergence"
path = "integration/training_convergence.rs"

[[test]]
name = "checkpoint_resume"
path = "integration/checkpoint_resume.rs"

[[test]]
name = "cross_platform"
path = "integration/cross_platform.rs"

[[bench]]
name = "performance_regression"
harness = false
path = "benches/performance_regression.rs"

[[bench]]
name = "comprehensive_benchmarks"
harness = false
path = "benches/comprehensive_benchmarks.rs"

[[bench]]
name = "overhead_report"
harness = false
path = "benches/overhead_report_bench.rs"

[[bench]]
name = "scaling_analysis"
harness = false
path = "benches/scaling_bench.rs"

[[bench]]
name = "metal_comparison"
harness = false
path = "benches/metal_bench.rs"

[[bench]]
name = "memory_benchmarks"
harness = false
path = "benches/memory_bench.rs"

[[bin]]
name = "ci_benchmarks"
path = "benches/ci_benchmarks_main.rs"

[[bin]]
name = "full_benchmarks"
path = "benches/full_benchmark_runner.rs"

[[test]]
name = "full_pipeline"
path = "integration/full_pipeline.rs"

[[test]]
name = "proof_chain"
path = "integration/proof_chain.rs"

[[test]]
name = "ci_validation"
path = "ci_validation.rs"

[[test]]
name = "on_chain_verification"
path = "integration/on_chain_verification.rs"
required-features = ["on-chain"]

[features]
default = []
parallel = ["rayon"]
metal = ["helix-prover/metal"]
on-chain = ["ethers", "hex"]

[dependencies.rayon]
version = "1.10"
optional = true
