# Grafana Dashboard Provisioning
# ================================

apiVersion: 1

providers:
  - name: 'HELIX Dashboards'
    orgId: 1
    folder: 'HELIX'
    folderUid: 'helix'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
