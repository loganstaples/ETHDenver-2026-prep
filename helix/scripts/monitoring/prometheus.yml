# HELIX Prometheus Configuration
# ===============================
# Production-grade metrics collection for HELIX distributed ML training.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  # Attach these labels to any time series or alerts
  external_labels:
    cluster: 'helix-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093
      timeout: 10s

# Rule files for alerting and recording
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # ==============================================================================
  # Prometheus self-monitoring
  # ==============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scheme: http

  # ==============================================================================
  # HELIX Aggregator Nodes
  # ==============================================================================
  - job_name: 'helix-aggregator'
    static_configs:
      - targets:
          - 'aggregator:9002'
        labels:
          role: 'aggregator'
          node_type: 'coordinator'
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+).*'
        replacement: '${1}'

  # ==============================================================================
  # HELIX Worker Nodes
  # ==============================================================================
  - job_name: 'helix-workers'
    static_configs:
      - targets:
          - 'worker1:9002'
          - 'worker2:9002'
          - 'worker3:9002'
        labels:
          role: 'worker'
          node_type: 'compute'
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+).*'
        replacement: '${1}'
      - source_labels: [__address__]
        target_label: worker_id
        regex: 'worker([0-9]+):.*'
        replacement: '${1}'

  # ==============================================================================
  # Docker Container Metrics (via cAdvisor)
  # ==============================================================================
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - 'cadvisor:8080'
    metrics_path: /metrics
    scrape_interval: 15s
    metric_relabel_configs:
      # Keep only HELIX container metrics
      - source_labels: [container_label_helix_service]
        regex: '.+'
        action: keep

  # ==============================================================================
  # Node Exporter (Host Metrics)
  # ==============================================================================
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
    metrics_path: /metrics
    scrape_interval: 15s

  # ==============================================================================
  # Ethereum Node (if running locally)
  # ==============================================================================
  - job_name: 'ethereum'
    static_configs:
      - targets:
          - 'ethereum:8545'
    metrics_path: /metrics
    scrape_interval: 30s

  # ==============================================================================
  # Grafana Metrics
  # ==============================================================================
  - job_name: 'grafana'
    static_configs:
      - targets:
          - 'grafana:3000'
    metrics_path: /metrics
    scrape_interval: 30s

  # ==============================================================================
  # Dynamic Service Discovery (Kubernetes)
  # ==============================================================================
  # Uncomment for Kubernetes deployments
  # - job_name: 'kubernetes-pods'
  #   kubernetes_sd_configs:
  #     - role: pod
  #   relabel_configs:
