{{- if and .Values.workers.enabled .Values.workers.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "helix.fullname" . }}-worker
  namespace: {{ .Values.namespace.name | default "helix" }}
  labels:
    {{- include "helix.worker.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.workers.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "helix.worker.selectorLabels" . | nindent 6 }}
{{- end }}
