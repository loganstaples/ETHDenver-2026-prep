{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helix.fullname" . }}-dashboard
  namespace: {{ .Values.namespace.name | default "helix" }}
  labels:
    {{- include "helix.dashboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "helix.dashboard.selectorLabels" . | nindent 4 }}
{{- end }}
