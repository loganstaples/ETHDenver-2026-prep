{{- if .Values.workers.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helix.fullname" . }}-worker
  namespace: {{ .Values.namespace.name | default "helix" }}
  labels:
    {{- include "helix.worker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.workers.service.type }}
  ports:
    - port: {{ .Values.workers.service.ports.p2p }}
      targetPort: p2p
      protocol: TCP
      name: p2p
    - port: {{ .Values.workers.service.ports.api }}
      targetPort: api
      protocol: TCP
      name: api
    - port: {{ .Values.workers.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "helix.worker.selectorLabels" . | nindent 4 }}
---
{{- if .Values.workers.headlessService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "helix.fullname" . }}-worker-headless
  namespace: {{ .Values.namespace.name | default "helix" }}
  labels:
    {{- include "helix.worker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.workers.service.ports.p2p }}
      targetPort: p2p
      protocol: TCP
      name: p2p
    - port: {{ .Values.workers.service.ports.api }}
      targetPort: api
      protocol: TCP
      name: api
  selector:
    {{- include "helix.worker.selectorLabels" . | nindent 4 }}
{{- end }}
{{- end }}
