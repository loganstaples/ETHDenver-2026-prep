name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run full test suite nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: helix=debug

jobs:
  # Quick validation on all PRs
  quick-tests:
    name: Quick Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run fast integration tests
        run: |
          cd helix/tests
          cargo test --test end_to_end -- --test-threads=1
          cargo test --test verification_consistency -- --test-threads=1
        timeout-minutes: 20

  # Full test suite
  full-tests:
    name: Full Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    strategy:
      fail-fast: false
      matrix:
        test:
          - name: "End-to-End"
            target: "end_to_end"
          - name: "MPC + ZKP"
            target: "mpc_zkp_integration"
          - name: "Adversarial"
            target: "adversarial"
          - name: "Network Partition"
            target: "network_partition"
          - name: "Verification"
            target: "verification_consistency"
          - name: "Training Convergence"
            target: "training_convergence"
          - name: "Checkpoint Resume"
            target: "checkpoint_resume"
          - name: "Cross Platform"
            target: "cross_platform"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run ${{ matrix.test.name }} tests
        run: |
          cd helix/tests
          cargo test --test ${{ matrix.test.target }} -- --test-threads=1 --nocapture
        timeout-minutes: 30

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.test.target }}
          path: |
            helix/tests/*.log
            helix/tests/*.json
          if-no-files-found: ignore

  # Cross-platform verification
  cross-platform:
    name: Cross-Platform Tests
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cross-platform tests
        run: |
          cd helix/tests
          cargo test --test cross_platform -- --test-threads=1
        timeout-minutes: 30

  # Stress tests (nightly only)
  stress-tests:
    name: Stress Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run extended adversarial tests
        run: |
          cd helix/tests
          STRESS_TEST=1 cargo test --test adversarial -- --test-threads=1 --ignored
        timeout-minutes: 60

      - name: Run network partition stress tests
        run: |
          cd helix/tests
          STRESS_TEST=1 cargo test --test network_partition -- --test-threads=1 --ignored
        timeout-minutes: 60

  # Summary job
  test-summary:
    name: Test Summary
    needs: [full-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.full-tests.result }}" == "failure" ]; then
            echo "::error::Some integration tests failed"
            exit 1
          fi
          echo "All integration tests passed!"

      - name: Generate summary
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Full Tests | ${{ needs.full-tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
