[workspace]
resolver = "2"
members = [
    "crates/helix-core",
    "crates/helix-avm",
    "crates/helix-circuits",
    "crates/helix-prover",
    "crates/helix-node",
    "crates/helix-client",
    "crates/helix-mpc",
    "crates/helix-demo",
    "desktop/src-tauri",
    "tests",
]

# Optimize dependencies in test builds — halo2 crypto operations are 10-100x
# slower at opt-level=0, causing test hangs from rayon thread pool contention.
[profile.test]
opt-level = 1

[workspace.metadata.demo]
# Shared SRS parameter: k=14 (2^14 = 16K rows) for demo-sized models
srs_k = 14
# Model dimensions for the demo: 2-layer MLP (d_in=2, d_hid=4, d_out=1)
model_d_in = 2
model_d_hid = 4
model_d_out = 1
