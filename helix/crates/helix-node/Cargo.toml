[package]
name = "helix-node"
version = "0.1.0"
edition = "2021"

[dependencies]
helix-core = { path = "../helix-core" }
helix-avm = { path = "../helix-avm" }
helix-prover = { path = "../helix-prover" }
helix-mpc = { path = "../helix-mpc" }
tokio = { version = "1", features = ["full", "macros", "sync", "net", "io-util", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
ethers = { version = "2.0.14", features = ["ws"] }
dotenv = "0.15.0"
futures = "0.3"
log = "0.4.29"
env_logger = "0.11.8"
hex = "0.4.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"
halo2curves = "0.7.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"], optional = true }

# Network transport (B2.1)
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.1"
webpki-roots = "0.26"
rcgen = "0.13"

# Compression (model distribution)
miniz_oxide = "0.8"

# Serialization/wire format (B2.4)
bincode = "1.3"
bytes = "1.5"
prost = "0.13"

# Discovery (B2.3)
mdns-sd = "0.11"
hostname = "0.4"
libp2p-kad = { version = "0.47", optional = true }

# Synchronization primitives
parking_lot = "0.12"
dashmap = "6.0"
async-trait = "0.1"
thiserror = "2.0"

# Time utilities
chrono = "0.4"

# LRU cache for replay detection
lru = "0.12"

# Encrypted weight storage (AES-256-GCM + Argon2id)
aes-gcm = "0.10"
argon2 = "0.5"

# HTTP API
axum = "0.7"
subtle = "2.5"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# IPFS storage
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Configuration
toml = "0.8"

[dev-dependencies]
tempfile = "3.24.0"
tokio-test = "0.4"

[features]
default = ["crypto-sign"]
dht = ["libp2p-kad"]
crypto-sign = ["ed25519-dalek"]
ipfs-fetch = []
s3-fetch = []

