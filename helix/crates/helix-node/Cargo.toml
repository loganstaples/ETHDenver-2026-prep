[package]
name = "helix-node"
version = "0.1.0"
edition = "2021"

[dependencies]
helix-core = { path = "../helix-core" }
helix-avm = { path = "../helix-avm" }
helix-prover = { path = "../helix-prover" }
helix-mpc = { path = "../helix-mpc" }
tokio = { version = "1", features = ["full", "macros", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
ethers = { version = "2.0.14", features = ["ws"] }
dotenv = "0.15.0"
futures = "0.3"
log = "0.4.29"
env_logger = "0.11.8"
hex = "0.4.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.24.0"

