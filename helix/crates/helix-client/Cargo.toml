[package]
name = "helix-client"
version = "0.1.0"
edition = "2021"
description = "HELIX CLI client for distributed ML training orchestration"

[[bin]]
name = "helix"
path = "src/main.rs"

[dependencies]
helix-core = { path = "../helix-core" }
helix-avm = { path = "../helix-avm" }
helix-prover = { path = "../helix-prover" }
helix-circuits = { path = "../helix-circuits" }

# Field arithmetic (for ZK proof integration)
ff = "0.13"

# CLI framework
clap = { version = "4.0", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Terminal UI
indicatif = "0.17"
console = "0.15"
colored = "2.0"

# HTTP client/server for health endpoints and dashboard
reqwest = { version = "0.11", features = ["json"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.14"
notify = "6.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
humantime-serde = "1.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
futures = "0.3"
async-trait = "0.1"
dirs = "5.0"
hex = "0.4"
rand = "0.8"
crossterm = "0.27"
ratatui = "0.26"

# Cryptography - Production-grade implementations
k256 = { version = "0.13", features = ["ecdsa", "schnorr", "sha256"] }
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
aes-gcm = "0.10"
scrypt = "0.11"
hkdf = "0.12"
argon2 = "0.5"

# BIP standards for mnemonic and HD derivation
coins-bip32 = "0.8"
coins-bip39 = "0.8"

# CSV export for audit logs
csv = "1.3"

# USB/HID for hardware wallets
hidapi = { version = "2.4", optional = true }

# Zeroize for secure memory handling
zeroize = { version = "1.7", features = ["derive"] }

# Base encoding
bs58 = "0.5"
base64 = "0.21"

# Secure random number generation
getrandom = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.9"
core-foundation = "0.9"
security-framework-sys = "2.9"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = "3.0"
zbus = "3.14"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = ["Win32_Security_Cryptography"] }

[features]
default = []
hardware-wallet = ["hidapi"]

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
tower = { version = "0.4", features = ["util"] }
hyper = "1.0"
