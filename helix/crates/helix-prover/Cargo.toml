[package]
name = "helix-prover"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = ["parallel"]
parallel = ["rayon"]
metal = ["metal-rs", "objc"]
cuda = []  # CUDA backend - requires NVCC and CUDA Toolkit

[dependencies]
helix-core = { path = "../helix-core" }
helix-avm = { path = "../helix-avm" }
helix-circuits = { path = "../helix-circuits" }
halo2curves = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
num_cpus = "1.16"
sha2 = "0.10"
num-bigint = "0.4"
rayon = { version = "1.8", optional = true }
blake3 = "1.5"
thiserror = "1.0"
tracing = "0.1"

# Metal GPU acceleration (macOS only)
[target.'cfg(target_os = "macos")'.dependencies]
metal-rs = { version = "0.29", package = "metal", optional = true }
objc = { version = "0.2", optional = true }

[build-dependencies]
# No external build dependencies needed - using raw nvcc commands

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "gkr_vs_halo2"
harness = false

[[bench]]
name = "gpu_acceleration"
harness = false

