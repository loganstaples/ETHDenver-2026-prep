[package]
name = "helix-circuits"
version = "0.1.0"
edition = "2021"

[dependencies]
helix-core = { path = "../helix-core" }
halo2_proofs = { git = "https://github.com/privacy-scaling-explorations/halo2", rev = "198e9ae30d322cd0ad003b6955f91ec095b1490d" }
halo2curves = "0.7.0"
sha2 = "0.10"
sha3 = "0.10"    # Keccak256 for EVM compatibility
hex = "0.4"     # Hex encoding for EVM proof format
subtle = "2.5"  # Constant-time cryptographic operations
rand_core = "0.6"  # OsRng for SRS generation

[dev-dependencies]
rand = "0.8"
criterion = "0.5"

[features]
default = []
profiling = []  # Enable detailed profiling (slight performance overhead)

[[bench]]
name = "circuit_benchmarks"
harness = false
