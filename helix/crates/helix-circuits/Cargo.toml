[package]
name = "helix-circuits"
version = "0.1.0"
edition = "2021"

[dependencies]
helix-core = { path = "../helix-core" }
halo2_proofs = { version = "0.3.0", features = ["dev-graph"] }
halo2curves = { version = "0.1.0" }
halo2_gadgets = "0.4.0"
sha2 = "0.10"
sha3 = "0.10"    # Keccak256 for EVM compatibility
hex = "0.4"     # Hex encoding for EVM proof format
subtle = "2.5"  # Constant-time cryptographic operations

[dev-dependencies]
rand = "0.8"
criterion = "0.5"

[features]
default = []
profiling = []  # Enable detailed profiling (slight performance overhead)

[[bench]]
name = "circuit_benchmarks"
harness = false
