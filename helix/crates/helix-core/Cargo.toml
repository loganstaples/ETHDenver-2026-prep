[package]
name = "helix-core"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sha2 = "0.10"
rayon = "1.10"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "data_pipeline_benchmarks"
harness = false
