[package]
name = "helix-core"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sha2 = "0.10"
rayon = "1.10"
libc = "0.2"
tracing = "0.1"
reqwest = { version = "0.12", features = ["rustls-tls"], optional = true }
ed25519-dalek = { version = "2.1", optional = true }

[features]
default = []
ipfs-fetch = ["reqwest"]
s3-fetch = ["reqwest"]
crypto-verify = ["ed25519-dalek"]

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "data_pipeline_benchmarks"
harness = false

[[bench]]
name = "error_algebra_benchmarks"
harness = false
