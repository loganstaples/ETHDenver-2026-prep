[package]
name = "helix-demo"
version = "0.1.0"
edition = "2021"
description = "HELIX MPC Training Demo for ETHDenver 2026"

[[bin]]
name = "helix-demo"
path = "src/main.rs"

[dependencies]
helix-core = { path = "../helix-core" }
helix-avm = { path = "../helix-avm" }
helix-mpc = { path = "../helix-mpc" }
helix-client = { path = "../helix-client", default-features = false }
helix-prover = { path = "../helix-prover", default-features = false }
helix-circuits = { path = "../helix-circuits" }

tokio = { version = "1", features = ["full", "signal"] }
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
indicatif = "0.17"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
ethers = { version = "2.0.14", features = ["ws"], optional = true }

[features]
default = ["chain"]
chain = ["ethers", "helix-client/chain"]
