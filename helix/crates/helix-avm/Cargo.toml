[package]
name = "helix-avm"
version = "0.1.0"
edition = "2021"

[dependencies]
helix-core = { path = "../helix-core" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
ndarray = { version = "0.16", optional = true }

[features]
default = ["blas-matmul"]
blas-matmul = ["ndarray"]

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "conv_benchmarks"
harness = false

[[bench]]
name = "matmul_benchmarks"
harness = false

