[package]
name = "helix-avm"
version = "0.1.0"
edition = "2021"

[dependencies]
helix-core = { path = "../helix-core" }
helix-circuits = { path = "../helix-circuits", optional = true }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
sha2 = { version = "0.10", optional = true }
ndarray = { version = "0.16", optional = true }

[features]
default = ["blas-matmul"]
blas-matmul = ["ndarray"]
circuit-bridge = ["helix-circuits", "sha2"]
manual-gradients = []

[dev-dependencies]
helix-circuits = { path = "../helix-circuits" }
sha2 = "0.10"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "conv_benchmarks"
harness = false

[[bench]]
name = "matmul_benchmarks"
harness = false

