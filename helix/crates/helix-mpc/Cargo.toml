[package]
name = "helix-mpc"
version = "0.1.0"
edition = "2021"
description = "Multi-Party Computation engine for HELIX trustless AI training"

[dependencies]
helix-core = { path = "../helix-core" }

crossbeam-channel = "0.5"
zeroize = { version = "1.7", features = ["derive"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
curve25519-dalek = "4.1"
num-bigint = { version = "0.4", features = ["rand", "serde"] }
num-traits = "0.2"
num-integer = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.1"
webpki-roots = "0.26"
rcgen = "0.13"
tracing = "0.1"
parking_lot = "0.12"
dashmap = "6.0"
async-trait = "0.1"
futures = "0.3"
bytes = "1.5"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
