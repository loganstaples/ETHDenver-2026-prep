[package]
name = "helix-mpc"
version = "0.1.0"
edition = "2021"
description = "Multi-Party Computation engine for HELIX trustless AI training"

[dependencies]
helix-core = { path = "../helix-core" }

thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
